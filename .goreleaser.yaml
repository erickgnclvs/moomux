version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    # Sign darwin binaries with the same certificate and identifier every
    # release so macOS permission grants survive upgrades (#304). Never
    # change the identifier or the certificate: either one makes every user
    # re-grant. SIGN_P12 / SIGN_PASS come from release.yml.
    hooks:
      post:
        - cmd: sh -c 'if [ "{{ .Os }}" = darwin ]; then rcodesign sign --p12-file "$SIGN_P12" --p12-password-file "$SIGN_PASS" --binary-identifier io.github.erickgnclvs.moomux "{{ .Path }}"; fi'
          env:
            - SIGN_P12={{ .Env.SIGN_P12 }}
            - SIGN_PASS={{ .Env.SIGN_PASS }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

brews:
  - name: moomux
    repository:
      owner: erickgnclvs
      name: homebrew-moomux
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/erickgnclvs/moomux
    description: "A tmux session manager TUI"
    license: MIT
    dependencies:
      - name: tmux
      - name: git
    test: |
      system "#{bin}/moomux", "--version"
    install: |
      bin.install "moomux"
    service: |
      run [opt_bin/"moomux", "serve"]
      keep_alive true
      log_path var/"log/moomux.log"
      error_log_path var/"log/moomux.log"
      environment_variables PATH: std_service_path_env
