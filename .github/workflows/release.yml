name: Release

on:
  push:
    tags:
      - "v*"
  # Deploy pushes release tags using the default GITHUB_TOKEN, and pushes
  # authenticated that way don't trigger other workflows (a deliberate
  # GitHub anti-recursion rule) — so the `push: tags` trigger above never
  # fires for automated tags. Deploy calls this dispatch instead.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # workflow_dispatch can be triggered manually with any string, and
      # inputs.tag feeds straight into checkout's ref: below — reject
      # anything that isn't an exact vX.Y.Z tag before it's used as a ref.
      - name: Validate tag input
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid tag input: $TAG (want vX.Y.Z)" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
