name: Release

on:
  push:
    tags:
      - "v*"
  # Deploy pushes release tags using the default GITHUB_TOKEN, and pushes
  # authenticated that way don't trigger other workflows (a deliberate
  # GitHub anti-recursion rule) — so the `push: tags` trigger above never
  # fires for automated tags. Deploy calls this dispatch instead.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # workflow_dispatch can be triggered manually with any string, and
      # inputs.tag feeds straight into checkout's ref: below — reject
      # anything that isn't an exact vX.Y.Z tag before it's used as a ref.
      - name: Validate tag input
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid tag input: $TAG (want vX.Y.Z)" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Darwin builds are signed with a stable self-signed certificate
      # (hooks.post in .goreleaser.yaml). macOS keys Accessibility / Screen
      # Recording grants to the signature; the Go linker's ad-hoc one changes
      # every build, so every upgrade silently dropped them (#304). Fail
      # rather than ship unsigned: that would drop everyone's grants again.
      - name: Set up darwin code signing
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::MACOS_SIGN_P12 / MACOS_SIGN_P12_PASSWORD secrets are not set" >&2
            exit 1
          fi
          v=0.29.0
          f=apple-codesign-$v-x86_64-unknown-linux-musl
          curl -fsSL -o "$RUNNER_TEMP/$f.tar.gz" "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$v/$f.tar.gz"
          echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  $RUNNER_TEMP/$f.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$f.tar.gz" -C "$RUNNER_TEMP"
          install "$RUNNER_TEMP/$f/rcodesign" /usr/local/bin/rcodesign
          echo "$P12" | base64 -d > "$RUNNER_TEMP/sign.p12"
          printf '%s' "$P12_PASSWORD" > "$RUNNER_TEMP/sign.pass"
          echo "SIGN_P12=$RUNNER_TEMP/sign.p12" >> "$GITHUB_ENV"
          echo "SIGN_PASS=$RUNNER_TEMP/sign.pass" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
